    <script>
      // Clear legacy service worker caches to prevent frontend split-brain
      if ('caches' in window) {
        caches.keys().then((keys) => {
          keys.forEach((key) => {
            if (key === 'bct-erp-v1') {
              console.log('[App] Evicting legacy cache:', key);
              caches.delete(key);
            }
          });
        });
      }
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update().catch(() => {});
          }).catch((err) => {
            console.log('SW registration skipped:', err);
          });
        });
      }
